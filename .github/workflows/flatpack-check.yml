name: Flatpack Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flatpack-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate private gem token
        run: |
          if [[ -z "$BOWERBIRD_ORG_CI_TOKEN" ]]; then
            echo "BOWERBIRD_ORG_CI_TOKEN is not available to this workflow." >&2
            exit 1
          fi
        env:
          BOWERBIRD_ORG_CI_TOKEN: ${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

      - name: Configure GitHub auth for private gems
        run: git config --global url."https://${BOWERBIRD_ORG_CI_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
        env:
          BOWERBIRD_ORG_CI_TOKEN: ${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: false

      - name: Install Flatpack checker
        run: bundle install
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

      - name: Run Flatpack check
        run: bundle exec flatpack-checker