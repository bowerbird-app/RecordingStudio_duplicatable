name: Flatpack Check

on:
  pull_request:
  push:
    branches: [main]

env:
  BOWERBIRD_ORG_CI_TOKEN: ${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
  BUNDLE_GITHUB__COM: ${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}:x-oauth-basic

jobs:
  flatpack-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure GitHub auth for private gems
        run: git config --global url."https://${BOWERBIRD_ORG_CI_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: false

      - name: Install Flatpack checker
        run: bundle install

      - name: Run Flatpack check
        run: bundle exec flatpack-checker