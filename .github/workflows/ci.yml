name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recording_studio_duplicatable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3']
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Validate private gem token
      run: |
        if [[ -z "$BOWERBIRD_ORG_CI_TOKEN" ]]; then
          echo "BOWERBIRD_ORG_CI_TOKEN is not available to this workflow." >&2
          exit 1
        fi
      env:
        BOWERBIRD_ORG_CI_TOKEN: ${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

    - name: Configure GitHub auth for private gems
      run: git config --global url."https://${BOWERBIRD_ORG_CI_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      env:
        BOWERBIRD_ORG_CI_TOKEN: ${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
    
    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
      env:
        BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
    
    - name: Install dummy app dependencies
      run: bundle install
      working-directory: test/dummy
      env:
        BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_duplicatable_test
    
    - name: Run database migrations
      run: bundle exec rake db:migrate RAILS_ENV=test
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_duplicatable_test

    - name: Build dummy app Tailwind CSS
      run: bundle exec rails tailwindcss:build RAILS_ENV=test
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_duplicatable_test

    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Run gem tests
      run: bundle exec rake app:test
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_duplicatable_test

    - name: Run dummy app tests
      run: bundle exec rails test
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_duplicatable_test
