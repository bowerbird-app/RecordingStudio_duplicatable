AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_duplicatable/hooks.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_duplicatable/capabilities/duplicatable.rb'
    - 'lib/recording_studio_duplicatable/services/duplication_service.rb'
    - 'lib/recording_studio_duplicatable/api.rb'
    - 'lib/recording_studio_duplicatable/api/duplicate_recording.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_duplicatable/capabilities/duplicatable.rb'
    - 'lib/recording_studio_duplicatable/api.rb'
    - 'lib/recording_studio_duplicatable/api/duplicate_recording.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_duplicatable/capabilities/duplicatable.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_duplicatable/capabilities/duplicatable.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_duplicatable/capabilities/duplicatable.rb'
    - 'lib/recording_studio_duplicatable/services/duplication_service.rb'
    - 'test/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_duplicatable/capabilities/duplicatable.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

Metrics/BlockLength:
  Exclude:
    - 'lib/recording_studio_duplicatable/capabilities/duplicatable.rb'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'lib/recording_studio_duplicatable/services/**/*'
    - 'test/services/**/*'

Naming/PredicateMethod:
  Exclude:
    - 'test/**/*'

Style/OptionalBooleanParameter:
  Exclude:
    - 'test/**/*'

Style/MutableConstant:
  Exclude:
    - 'test/**/*'
